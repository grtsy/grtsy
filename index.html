.nav {

.dropdown {
  position: relative;
  cursor: pointer;
}
.drop-btn {
  color: #0066cc;
}
.dropdown-menu {
  position: absolute;
  top: 100%;
  left: 0;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  border-radius: 4px;
  padding: 8px 0;
  min-width: 120px;
  display: none;
  z-index: 999;
}
.dropdown-menu a {
  display: block;
  padding: 8px 16px;
  white-space: nowrap;
}
.dropdown-menu a:hover {
  background: #f5f5f5;
}
.dropdown.active .dropdown-menu {
  display: block;
}

<script>
// 1. 点击分类，切换下拉显示/隐藏
const dropdown = document.querySelector('.dropdown');
dropdown.addEventListener('click', function(e) {
  e.stopPropagation();
  this.classList.toggle('active');
});

// 点击空白关闭下拉
document.addEventListener('click', function() {
  dropdown.classList.remove('active');
});

// 2. 点击选项筛选壁纸
const menuItems = document.querySelectorAll('.dropdown-menu a');
menuItems.forEach(item => {
  item.addEventListener('click', function(e) {
    e.preventDefault();
    const type = this.dataset.type;
    filterWallpaper(type);
    dropdown.classList.remove('active');
  });
});

// 筛选函数
function filterWallpaper(type) {
  const allWallpaper = document.querySelectorAll('.wallpaper');
  allWallpaper.forEach(wp => {
    wp.style.display = wp.classList.contains(type) ? 'block' : 'none';
  });
}
</script>
